apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/usage-backend/k8s
  - web.yaml
patches:
  - target:
      kind: Deployment
      name: usage-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: usage-backend
      spec:
        template:
          spec:
            containers:
              - name: usage-backend
                env:
                  - name: DJANGO_ALLOWED_HOSTS
                    value: localhost,127.0.0.1,usage-backend,usage-backend.default.svc.cluster.local
