name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/usage-backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r apps/usage-backend/requirements-dev.txt
      - name: usage-backend lint, checks, and tests
        working-directory: apps/usage-backend
        run: |
          ruff check .
          ruff format --check .
          python manage.py check --settings=config.settings.test
          python manage.py test --settings=config.settings.test
      - name: Mock tests
        working-directory: apps/mock-cypienta-api
        run: python manage.py test
  web:
    name: Web and Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cypienta-ci
      API_URL: http://mock-cypienta-api:40759
      API_KEY: local-dev-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend and generate route types
        run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:web
      - run: pnpm test:web
      - name: Install Chromium
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium
      - name: Build and start all three apps
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Backend HTTP smoke test
        run: python3 apps/usage-backend/scripts/smoke_test.py
      - name: Browser tests against the Docker stack
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_LIVE_BACKEND: "1"
        run: pnpm --filter ./apps/web exec playwright test --reporter=line,html
      - name: Collect container logs
        if: ${{ !cancelled() }}
        run: docker compose logs --no-color > docker-compose.log
      - name: Upload browser results and container logs
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ci-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            docker-compose.log
          retention-days: 7
      - name: Stop the Docker stack
        if: always()
        run: docker compose down --volumes
