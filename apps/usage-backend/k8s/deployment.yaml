apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usage-backend
  template:
    metadata:
      labels:
        app: usage-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usage-backend
          image: usage-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: usage-backend-config
                  key: API_URL
            - name: DJANGO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,usage-backend,usage-backend.default.svc.cluster.local
            # HTTP for the local port-forward demo; enable HTTPS behind a trusted ingress.
            - name: DJANGO_HTTPS
              value: "false"
          envFrom:
            - secretRef:
                name: usage-backend-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            timeoutSeconds: 12
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
